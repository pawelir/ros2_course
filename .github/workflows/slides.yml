name: Build slides

on:
  push:
    branches: [main]
    paths: ["slides/**", "examples/**", "solutions/**", "templates/**", ".devcontainer/**", ".github/workflows/slides.yml"]
  pull_request:
    paths: ["slides/**", "examples/**", "solutions/**", "templates/**", ".devcontainer/**"]
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: slides

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - run: npm ci

      # Fonts used by the theme; marp-cli brings its own Chromium.
      - run: sudo apt-get update && sudo apt-get install -y fonts-ubuntu

      - name: Check code snippets against their source files
        run: python3 check_snippets.py

      - name: Build HTML, PDF and PPTX
        run: npm run build

      - name: Merge module PDFs into one course deck
        run: |
          sudo apt-get install -y poppler-utils
          pdfunite build/pdf/*.pdf build/ros2-course-jazzy.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: slides/build/

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slides/build/ros2-course-jazzy.pdf
            slides/build/pptx/*.pptx
